name: Publish image

# Manual image publication only. Source and notebook pushes do not publish an image.
# The shared workflow smoke-tests /health before an explicitly requested publication.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The template repositories themselves publish no image; forks do.
    if: ${{ !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/docker-publish.yml@v1
    secrets: inherit
    with:
      image_name: vgi-rdf-worker
      smoke_import: "rdf_worker, vgi, pyarrow"
      health_port: "8000"
      version_check_cmd: "ci/check-version.sh"
