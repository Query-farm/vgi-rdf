# Private grader for the RDF inspection task published in catalog metadata.
tasks:
  - name: inspect_main_schema
    reference_sql: >-
      SELECT count(*) AS main_schemas FROM rdf.main.rdf_quads()
      WHERE predicate = '<urn:vgi:rdf:schemaName>' AND object = '"main"'
  - name: query_catalog_sparql
    reference_sql: >-
      SELECT answer FROM rdf.main.rdf_sparql('ASK { GRAPH <urn:vgi:rdf:catalog> { ?s ?p ?o } }')
  - name: discover_table_mapping
    reference_sql: SELECT count(*) FROM rdf.main.rdf_tables()
  - name: inspect_neighbors
    reference_sql: SELECT count(*) FROM rdf.main.rdf_neighbors('urn:example:absent')
  - name: inspect_reachability
    reference_sql: SELECT count(*) FROM rdf.main.rdf_reachable('urn:example:absent', max_depth := 3)
  - name: inspect_row_identity
    reference_sql:
      - CREATE TABLE rdf.main.agent_people(name VARCHAR)
      - INSERT INTO rdf.main.agent_people VALUES ('Ada')
      - SELECT name, starts_with(__rdf_iri, 'urn:vgi:rdf:table:') FROM rdf.main.rdf_rows('main','agent_people')
