[project]
name = "vgi-rdf-notebooks"
version = "0.1.0"
description = "SQL and graph examples for the released VGI RDF worker"
requires-python = ">=3.12,<3.15"
dependencies = ["vgi-example-notebooks[runner]"]

[tool.uv.sources]
vgi-example-notebooks = { git = "https://github.com/Query-farm/vgi-example-notebooks", tag = "v0.3.26" }

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# JupySQL result variables are assigned by %%sql cells.
"*.ipynb" = ["F821"]
